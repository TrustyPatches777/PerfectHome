name: Deploy to GitHub Pages

# Runs on every push to main (and can be started by hand from the Actions tab).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # tsc --noEmit, then vite build into dist/ (relative base, so any repo name works)
      - run: npm run build
        # Optional relay (TURN) for live sessions on networks that block direct connections: repository secrets TURN_URLS (addresses separated by
        # spaces), TURN_USERNAME, TURN_CREDENTIAL. Left empty = no relay built in (people can still type one into the Live dialog). Note that anything
        # built into the site is readable by anyone who opens it, so use a free, low-limit account.
        env:
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
